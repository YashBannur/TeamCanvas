spring:
  application:
    name: teamcanvas
  config:
    # Loads backend/.env (if present) so ${DB_USERNAME}, ${JWT_SECRET}, ... resolve locally.
    import: "optional:file:.env[.properties]"
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/teamcanvas?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; Hibernate only verifies it matches the entities
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.type.preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry: 30m
  refresh:
    expiry: 24h                    # sliding: every refresh issues a new token with a fresh 24h life
    cookie-name: tc_refresh
    cookie-secure: ${COOKIE_SECURE:false}
    cookie-same-site: ${COOKIE_SAME_SITE:Lax}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    root: INFO
    com.teamcanvas: INFO
