# Used by integration tests (@ActiveProfiles("test")).
# Uses a SEPARATE database so your real data in "teamcanvas" is never touched.
# Username and password still come from your .env (through application.yml).
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/teamcanvas_test?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

app:
  jwt:
    secret: integration-test-secret-key-with-more-than-32-characters
